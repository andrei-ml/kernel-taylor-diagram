[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "kernel_taylor_diagram"
version = "0.1.0"
dependencies = [
    "numpy",
    "scipy",
    "scikit-learn",
    "matplotlib"
]

[tool.setuptools]
package-dir = {"" = "src"}
py-modules = ["kernel_taylor_diagram", "taylor_diagram_plot"]