[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "kernel_taylor_diagram"
version = "0.1.0"
description = "Kernel extensions of the Taylor diagram"
readme = "README.md"
license = {file = "LICENSE"}
requires-python = ">=3.9"
dependencies = [
    "numpy",
    "scikit-learn>=1.6",
    "matplotlib"
]

[tool.setuptools]
package-dir = {"" = "src"}
py-modules = ["kernel_taylor_diagram", "taylor_diagram_plot"]